<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Sound Blaster Command: a speaker in the page red on a dark tile, its sound
       spreading as the halftone dots of the app's room floor. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0353e"/>
      <stop offset="1" stop-color="#b8141d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e3262f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e3262f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="50" cy="66" r="44" fill="url(#glow)"/>
  <!-- the speaker -->
  <rect x="22" y="22" width="56" height="84" rx="11" fill="url(#box)"/>
  <circle cx="50" cy="42" r="7.5" fill="#ffffff"/>
  <circle cx="50" cy="76" r="19" fill="none" stroke="#ffffff" stroke-width="9"/>
  <circle cx="50" cy="76" r="5.5" fill="#ffffff"/>
  <!-- its sound: halftone dots growing outwards -->
  <circle cx="90" cy="76" r="4" fill="#ff5a62"/>
  <circle cx="103" cy="76" r="5.5" fill="#ff5a62"/>
  <circle cx="96" cy="60" r="3.2" fill="#ff5a62" fill-opacity="0.85"/>
  <circle cx="96" cy="92" r="3.2" fill="#ff5a62" fill-opacity="0.85"/>
  <circle cx="108" cy="54" r="2.6" fill="#ff5a62" fill-opacity="0.7"/>
  <circle cx="108" cy="98" r="2.6" fill="#ff5a62" fill-opacity="0.7"/>
</svg>
