[package]
name = "sbcommand"
version = "1.0.0"
edition = "2024"
description = "Sound Blaster Command for Linux: control panel for the Sound Blaster ZxR (CA0132)"
license = "GPL-3.0-or-later"
repository = "https://github.com/ImZoomBoy/soundblaster-command-linux"
readme = "README.md"
keywords = ["sound-blaster", "creative", "gtk4", "libadwaita", "pipewire"]
categories = ["multimedia::audio"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
alsa = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
